on: [push, pull_request]

name: Continuous Integration

jobs:
  test:
    name: Test Suite
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            code_name: jammy
          - os: ubuntu-24.04
            code_name: noble

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v2

      # No toolchain is named here on purpose: rustup reads rust-toolchain.toml
      - name: rustup setup
        run: rustup toolchain install

      - name: cargo setup
        # --locked uses cargo-audit's own lockfile; to not pick up broken tinyvec 1.13.0.
        run: cargo install cargo-audit --locked

      - name: fmt
        run: cargo fmt -- --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: audit
        run: cargo audit --deny warnings

      - name: test
        run: cargo test
